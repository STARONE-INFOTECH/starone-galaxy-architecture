name: markdown-validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  markdown-lint:
    name: Markdown Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          config: |
            {
              "MD013": false,
              "MD025": false,
              "MD033": false,
              "MD041": false,
              "MD055": false,
              "MD031": false,
              "MD032": false,
              "MD022": false,
              "MD026": false,
              "MD036": false,
              "MD012": false,
              "MD047": false
            }
          globs: |
            **/*.md
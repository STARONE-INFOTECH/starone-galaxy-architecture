name: markdown-validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  markdown-lint:
    name: Markdown Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: |
            **/*.md
name: Reusable Governance Validation

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-validation:
    name: Commit Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Commit Messages
        uses: wagoid/commitlint-github-action@v6
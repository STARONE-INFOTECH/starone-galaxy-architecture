name: naming-validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  naming-validation:
    name: Naming Standards Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Naming Standards
        run: |
          echo "Running naming governance validation..."

          find . -type f | grep -E '[A-Z]{2,}' || true

          echo "Naming validation completed."
name: Task
description: Create a new implementation task
title: "[TASK] "
labels:
  - type:task

body:

  - type: input
    id: epic
    attributes:
      label: Epic Reference
      placeholder: EPIC-ARCH-001
    validations:
      required: true

  - type: input
    id: parent-story
    attributes:
      label: Parent Story Reference
      placeholder: STORY-ARCH-005
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Draft
        - Ready for Implementation
        - In Progress
        - Review
        - Completed
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Area
      placeholder: governance | architecture | platform | security
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner (Optional)
      placeholder: sachin-salunke
    validations:
      required: false

  - type: input
    id: labels
    attributes:
      label: Additional Labels (Optional)
      placeholder: governance, automation, documentation
    validations:
      required: false

  - type: textarea
    id: objective
    attributes:
      label: Task Objective
      description: Describe the implementation objective.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define what is included and excluded.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: List expected outputs of this task.
    validations:
      required: true

  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation Notes
      description: Technical implementation guidance, constraints, or dependencies.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Use Given / When / Then format.
      value: |
        Given

        When

        Then
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      value: |
        - [ ] Scope implemented
        - [ ] Documentation updated
        - [ ] Traceability updated
        - [ ] Validation completed
        - [ ] Review completed
        - [ ] Governance checklist satisfied
    validations:
      required: true

  - type: textarea
    id: traceability
    attributes:
      label: Traceability
      value: |
        Epic Reference:
        Story Reference:
        Requirement Reference:
        Deliverable Reference:
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and Risks
      description: List dependencies, assumptions, blockers, and risks.
    validations:
      required: false
name: Enhancement
description: Request an improvement to an existing capability
title: "[ENHANCEMENT] "
labels:
  - type:enhancement

body:

  - type: input
    id: epic
    attributes:
      label: Epic Reference
      placeholder: EPIC-ARCH-001
    validations:
      required: true

  - type: input
    id: related-story
    attributes:
      label: Related Story Reference (Optional)
      placeholder: STORY-ARCH-005
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Draft
        - Ready for Review
        - Approved
        - In Progress
        - Review
        - Completed
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Area
      placeholder: governance | architecture | platform | security
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner (Optional)
      placeholder: sachin-salunke
    validations:
      required: false

  - type: input
    id: labels
    attributes:
      label: Additional Labels (Optional)
      placeholder: improvement, optimization, usability
    validations:
      required: false

  - type: textarea
    id: current-state
    attributes:
      label: Current State
      description: Describe the current behavior, process, or capability.
    validations:
      required: true

  - type: textarea
    id: proposed-enhancement
    attributes:
      label: Proposed Enhancement
      description: Describe the proposed improvement.
    validations:
      required: true

  - type: textarea
    id: business-justification
    attributes:
      label: Business Justification
      description: Explain why this enhancement is needed.
    validations:
      required: true

  - type: textarea
    id: expected-benefits
    attributes:
      label: Expected Benefits
      description: Describe expected business, operational, or technical improvements.
    validations:
      required: true

  - type: textarea
    id: impact-analysis
    attributes:
      label: Impact Analysis
      description: Describe impacted systems, repositories, services, or processes.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Use Given / When / Then format.
      value: |
        Given

        When

        Then
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      value: |
        - [ ] Enhancement implemented
        - [ ] Documentation updated
        - [ ] Traceability updated
        - [ ] Validation completed
        - [ ] Review completed
        - [ ] Governance checklist satisfied
    validations:
      required: true

  - type: textarea
    id: traceability
    attributes:
      label: Traceability
      value: |
        Epic Reference:
        Story Reference:
        Requirement Reference:
        Deliverable Reference:
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and Risks
      description: List dependencies, assumptions, blockers, and risks.
    validations:
      required: false